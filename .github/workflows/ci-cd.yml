name: CI/CD Pipeline - Food Order Menu Service

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -----------------------------------------------------------
  # Step 1: Code Quality, Lint & Build Verification
  # -----------------------------------------------------------
  lint-and-test:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run TypeScript & Code Lint
        run: npm run lint

      - name: Run Production Application Build
        run: npm run build

  # -----------------------------------------------------------
  # Step 2: Docker Build, Health Smoke Test & Docker Hub Push
  # -----------------------------------------------------------
  docker-build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Platform
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: food-order-service:test

      - name: Test Container Health & Prometheus /metrics Endpoint
        run: |
          docker run -d --name food-app-test -p 3000:3000 food-order-service:test
          sleep 6
          curl --fail http://localhost:3000/api/health || exit 1
          curl --fail http://localhost:3000/metrics | grep "food_orders_total" || exit 1
          docker stop food-app-test

      - name: Log in to Docker Hub (if secrets configured)
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-order-menu:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-order-menu:${{ github.sha }}
